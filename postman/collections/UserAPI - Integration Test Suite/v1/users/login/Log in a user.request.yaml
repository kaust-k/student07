$kind: http-request
description: ""
url: "{{baseUrl}}/v1/users/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
        "username": "{{username}}",
        "password": "{{password}}"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "username": {
          "type": "string"
        },
        "password": {
          "type": "string"
        }
      }
    }
scripts:
  - type: beforeRequest
    code: console.log(pm.variables.get("username"));
    language: text/javascript
settings: {}
examples: ./.resources/Log in a user.resources/examples
order: 1000
